global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'fastapi_app'
    static_configs:
      - targets: ['app:8000']

  - job_name: 'redis_exporter'
    static_configs:
      - targets: ['redis-exporter:9121']