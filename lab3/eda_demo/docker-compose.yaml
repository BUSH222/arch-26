version: "3.9"

services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    ports:
      - "5432:5432"

  redis:
    image: eqalpha/keydb
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"
      - "5672:5672"

  app:
    build: .
    depends_on:
      - postgres
      - redis
      - rabbitmq
    ports:
      - "8000:8000"
      
  notification-service:
    build: .
    command: python -u notification_service.py
    depends_on:
      - rabbitmq
